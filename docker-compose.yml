
services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db

  user-service:
    build: ./user-service
    ports:
      - "5001:5001"
    environment:
      - MONGO_URL=mongodb://mongo:27017/userdb
    depends_on:
      - mongo

  menu-service:
    build: ./menu-service
    ports:
      - "5002:5002"
    environment:
      - MONGO_URL=mongodb://mongo:27017/menudb
    depends_on:
      - mongo

  order-service:
    build: ./order-service
    ports:
      - "5003:5003"
    environment:
      - MONGO_URL=mongodb://mongo:27017/orderdb
      - USER_SERVICE_URL=http://user-service:5001
      - MENU_SERVICE_URL=http://menu-service:5002
    depends_on:
      - user-service
      - menu-service
      - mongo

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - user-service
      - menu-service
      - order-service

volumes:
  mongo-data:
